name: Rig Layout Planner tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-source:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Execute standard-library synthetic tests
        run: |
          python --version
          python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run synthetic planner geometry and selection regressions
        run: |
          node --version
          node --test
      - name: Check bundled offline pages
        run: python -B tools/build.py --check
